<script>
document.addEventListener("DOMContentLoaded", () => {

    // ==========================================
    // ELEMENT UTAMA
    // ==========================================

    const opening = document.getElementById("opening");
    const seal = document.getElementById("seal");
    const mainContent = document.getElementById("mainContent");

    let opened = false;


    // ==========================================
    // SEMBUNYIKAN MAIN CONTENT
    // ==========================================

    if (mainContent) {
        mainContent.style.opacity = "0";
        mainContent.style.visibility = "hidden";
        mainContent.style.pointerEvents = "none";
    }


    // ==========================================
    // BUKA INVITATION
    // ==========================================

    function openInvitation() {

        if (opened) return;

        opened = true;

        if (seal) {
            seal.classList.add("seal-open");
        }

        const doorLeft = document.querySelector(".door-left");
        const doorRight = document.querySelector(".door-right");

        if (doorLeft) {
            doorLeft.classList.add("open");
        }

        if (doorRight) {
            doorRight.classList.add("open");
        }

        setTimeout(() => {

            if (opening) {
                opening.classList.add("hide");
            }

            if (mainContent) {
                mainContent.style.opacity = "1";
                mainContent.style.visibility = "visible";
                mainContent.style.pointerEvents = "auto";
            }

            document.body.classList.remove("locked");

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

            startPetals();

        }, 1500);
    }


    // ==========================================
    // SEAL CLICK
    // ==========================================

    if (seal) {

        seal.addEventListener("click", openInvitation);

        seal.addEventListener("keydown", (e) => {

            if (e.key === "Enter" || e.key === " ") {

                e.preventDefault();

                openInvitation();

            }

        });

    }


    // ==========================================
    // BUNGA JATUH
    // ==========================================

    const petalContainer =
        document.querySelector(".petal-container");

    let petalsStarted = false;


    function createPetal() {

        if (!petalContainer) return;

        const petal =
            document.createElement("div");

        petal.className = "petal";

        petal.style.left =
            Math.random() * 100 + "%";

        petal.style.animationDuration =
            (4 + Math.random() * 5) + "s";

        petal.style.opacity =
            (0.25 + Math.random() * 0.4);

        petalContainer.appendChild(petal);

        setTimeout(() => {

            petal.remove();

        }, 9000);

    }


    function startPetals() {

        if (petalsStarted || !petalContainer) {
            return;
        }

        petalsStarted = true;

        setInterval(createPetal, 500);

    }


    // ==========================================
    // COUNTDOWN
    // ==========================================

    const WEDDING_DATE =
        new Date("2026-12-19T11:00:00+08:00");


    function updateCountdown() {

        const daysEl =
            document.getElementById("days");

        const hoursEl =
            document.getElementById("hours");

        const minutesEl =
            document.getElementById("minutes");

        const secondsEl =
            document.getElementById("seconds");


        // Kalau countdown HTML belum ada,
        // jangan crash.

        if (
            !daysEl ||
            !hoursEl ||
            !minutesEl ||
            !secondsEl
        ) {
            return;
        }


        const now = new Date();

        const diff =
            WEDDING_DATE - now;


        if (diff <= 0) {

            daysEl.textContent = "00";
            hoursEl.textContent = "00";
            minutesEl.textContent = "00";
            secondsEl.textContent = "00";

            return;

        }


        const days =
            Math.floor(
                diff / 86400000
            );


        const hours =
            Math.floor(
                (diff % 86400000) /
                3600000
            );


        const minutes =
            Math.floor(
                (diff % 3600000) /
                60000
            );


        const seconds =
            Math.floor(
                (diff % 60000) /
                1000
            );


        daysEl.textContent =
            String(days).padStart(2, "0");

        hoursEl.textContent =
            String(hours).padStart(2, "0");

        minutesEl.textContent =
            String(minutes).padStart(2, "0");

        secondsEl.textContent =
            String(seconds).padStart(2, "0");

    }


    updateCountdown();

    setInterval(updateCountdown, 1000);


    // ==========================================
    // GOOGLE MAPS
    // ==========================================

    window.openGoogleMaps = function () {

        window.open(
            "https://www.google.com/maps/search/?api=1&query=2.3807618,103.7116231",
            "_blank"
        );

    };


    // ==========================================
    // WAZE
    // ==========================================

    window.openWaze = function () {

        window.open(
            "https://www.waze.com/ul?ll=2.3807618%2C103.7116231&navigate=yes",
            "_blank"
        );

    };


    // ==========================================
    // GOOGLE CALENDAR
    // ==========================================

    window.addGoogleCalendar = function () {

        const title =
            "Majlis Perkahwinan Sikin & Aziman";

        const start =
            "20261219T030000Z";

        const end =
            "20261219T080000Z";

        const location =
            "No 66 Blok 5B Jalan Merak, Felda Nitar 01, 86800 Mersing, Johor";

        const details =
            "Walimatulurus Sikin & Aziman";

        const url =
            "https://calendar.google.com/calendar/render" +
            "?action=TEMPLATE" +
            "&text=" + encodeURIComponent(title) +
            "&dates=" + start + "/" + end +
            "&location=" + encodeURIComponent(location) +
            "&details=" + encodeURIComponent(details);

        window.open(url, "_blank");

    };


    // ==========================================
    // APPLE CALENDAR
    // ==========================================

    window.addAppleCalendar = function () {

        const ics =
`BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//Sikin & Aziman//Wedding//MS
BEGIN:VEVENT
DTSTART:20261219T030000Z
DTEND:20261219T080000Z
SUMMARY:Majlis Perkahwinan Sikin & Aziman
LOCATION:No 66 Blok 5B Jalan Merak, Felda Nitar 01, 86800 Mersing, Johor
DESCRIPTION:Walimatulurus Sikin & Aziman
END:VEVENT
END:VCALENDAR`;

        const blob =
            new Blob(
                [ics],
                {
                    type:
                        "text/calendar;charset=utf-8"
                }
            );

        const url =
            URL.createObjectURL(blob);

        const a =
            document.createElement("a");

        a.href = url;

        a.download =
            "jemputan-sikin-aziman.ics";

        document.body.appendChild(a);

        a.click();

        document.body.removeChild(a);

        URL.revokeObjectURL(url);

    };


    // ==========================================
    // POPUP MENU
    // ==========================================

    const menus = {

        calBtn: "calPopup",
        locBtn: "locPopup",
        musBtn: "musPopup",
        rsvpBtn: "rsvpPopup"

    };


    Object.entries(menus).forEach(
        ([buttonId, popupId]) => {

            const button =
                document.getElementById(buttonId);

            const popup =
                document.getElementById(popupId);


            if (!button || !popup) {
                return;
            }


            button.addEventListener(
                "click",
                (e) => {

                    e.stopPropagation();

                    closeAllPopups();

                    popup.classList.add("open");

                }
            );

        }
    );


    // ==========================================
    // HOME
    // ==========================================

    const homeBtn =
        document.getElementById("homeBtn");


    if (homeBtn) {

        homeBtn.addEventListener(
            "click",
            () => {

                closeAllPopups();

                const home =
                    document.getElementById("home");

                if (home) {

                    home.scrollIntoView({
                        behavior: "smooth"
                    });

                }

            }
        );

    }


    // ==========================================
    // CLOSE POPUP
    // ==========================================

    document
        .querySelectorAll(".close-popup")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    const popupId =
                        button.dataset.close;

                    const popup =
                        document.getElementById(
                            popupId
                        );

                    if (popup) {

                        popup.classList.remove(
                            "open"
                        );

                    }

                }
            );

        });


    function closeAllPopups() {

        document
            .querySelectorAll(".popup-menu")
            .forEach(popup => {

                popup.classList.remove("open");

            });

    }


    // ==========================================
    // KLIK LUAR POPUP
    // ==========================================

    document.addEventListener(
        "click",
        (e) => {

            if (
                !e.target.closest(".popup-menu") &&
                !e.target.closest(".bottom-nav")
            ) {

                closeAllPopups();

            }

        }
    );


    // ==========================================
    // RSVP
    // ==========================================

    document
        .querySelectorAll(".rsvp-option")
        .forEach(option => {

            option.addEventListener(
                "click",
                () => {

                    const value =
                        option.dataset.val;

                    const successPopup =
                        document.getElementById(
                            "successPopup"
                        );

                    const title =
                        document.getElementById(
                            "successTitle"
                        );

                    const msg =
                        document.getElementById(
                            "successMsg"
                        );


                    if (
                        !successPopup ||
                        !title ||
                        !msg
                    ) {
                        return;
                    }


                    if (value === "hadir") {

                        title.textContent =
                            "Terima Kasih! 💙";

                        msg.textContent =
                            "Kami sangat mengalu-alukan kehadiran anda ke majlis Sikin & Aziman.";

                    } else {

                        title.textContent =
                            "Terima Kasih! 🙏";

                        msg.textContent =
                            "Terima kasih kerana memaklumkan kepada kami.";

                    }


                    closeAllPopups();

                    successPopup.classList.add(
                        "open"
                    );

                }
            );

        });


    // ==========================================
    // MUZIK
    // ==========================================

    const music =
        document.getElementById(
            "weddingMusic"
        );

    const musicButton =
        document.getElementById(
            "musPlayBtn"
        );

    const floatingButton =
        document.getElementById(
            "musicFloating"
        );


    let musicPlaying = false;


    function toggleMusic() {

        if (!music) {

            alert(
                "Audio tidak dijumpai. Pastikan <audio id=\"weddingMusic\"> ada dalam HTML."
            );

            return;

        }


        if (musicPlaying) {

            music.pause();

            musicPlaying = false;


            if (musicButton) {

                musicButton.textContent =
                    "▶ Mainkan Muzik";

            }


            if (floatingButton) {

                floatingButton.textContent =
                    "🎵";

            }


        } else {

            music.play()
                .then(() => {

                    musicPlaying = true;


                    if (musicButton) {

                        musicButton.textContent =
                            "⏸ Hentikan Muzik";

                    }


                    if (floatingButton) {

                        floatingButton.textContent =
                            "⏸";

                    }

                })
                .catch(() => {

                    alert(
                        "Sila pastikan fail MP3 wujud dan laluan audio betul."
                    );

                });

        }

    }


    if (musicButton) {

        musicButton.addEventListener(
            "click",
            toggleMusic
        );

    }


    if (floatingButton) {

        floatingButton.addEventListener(
            "click",
            toggleMusic
        );

    }

});
</script>
