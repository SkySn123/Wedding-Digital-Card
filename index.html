<script>
document.addEventListener("DOMContentLoaded", () => {

    const opening = document.getElementById("opening");
    const seal = document.getElementById("seal");
    const mainContent = document.getElementById("mainContent");

    let opened = false;

    // ================================
    // PAGE 1 DISEMBUNYIKAN PADA AWAL
    // ================================
    mainContent.style.opacity = "0";
    mainContent.style.visibility = "hidden";
    mainContent.style.pointerEvents = "none";

    // ================================
    // TEKAN SEAL
    // ================================
    seal.addEventListener("click", openInvitation);

    // Keyboard support
    seal.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            openInvitation();
        }
    });

    function openInvitation() {

        if (opened) return;
        opened = true;

        // Seal hilang
        seal.classList.add("seal-open");

        // Buka pintu kiri & kanan
        document.querySelector(".door-left").classList.add("open");
        document.querySelector(".door-right").classList.add("open");

        // Tunggu animasi pintu habis
        setTimeout(() => {

            // Hilangkan opening
            opening.classList.add("hide");

            // Munculkan Page 1
            mainContent.style.opacity = "1";
            mainContent.style.visibility = "visible";
            mainContent.style.pointerEvents = "auto";

            // Benarkan scroll
            document.body.classList.remove("locked");

            // Scroll ke Page 1
            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

            // Mulakan bunga
            startPetals();

        }, 1500);
    }

    // ================================
    // BUNGA JATUH
    // ================================
    const petalContainer = document.querySelector(".petal-container");
    let petalsStarted = false;

    function createPetal() {

        const petal = document.createElement("div");

        petal.className = "petal";

        petal.style.left =
            Math.random() * 100 + "%";

        petal.style.animationDuration =
            (4 + Math.random() * 5) + "s";

        petal.style.opacity =
            (0.25 + Math.random() * 0.4);

        petalContainer.appendChild(petal);

        setTimeout(() => {
            petal.remove();
        }, 9000);
    }

    function startPetals() {

        if (petalsStarted) return;

        petalsStarted = true;

        setInterval(createPetal, 500);
    }


    // ================================
    // COUNTDOWN
    // ================================
    const WEDDING_DATE =
        new Date("2026-12-19T11:00:00+08:00");

    function updateCountdown() {

        const now = new Date();
        const diff = WEDDING_DATE - now;

        if (diff <= 0) {

            document.getElementById("days").textContent = "00";
            document.getElementById("hours").textContent = "00";
            document.getElementById("minutes").textContent = "00";
            document.getElementById("seconds").textContent = "00";

            return;
        }

        const days =
            Math.floor(diff / 86400000);

        const hours =
            Math.floor(
                (diff % 86400000) / 3600000
            );

        const minutes =
            Math.floor(
                (diff % 3600000) / 60000
            );

        const seconds =
            Math.floor(
                (diff % 60000) / 1000
            );

        document.getElementById("days").textContent =
            String(days).padStart(2, "0");

        document.getElementById("hours").textContent =
            String(hours).padStart(2, "0");

        document.getElementById("minutes").textContent =
            String(minutes).padStart(2, "0");

        document.getElementById("seconds").textContent =
            String(seconds).padStart(2, "0");
    }

    updateCountdown();

    setInterval(updateCountdown, 1000);


    // ================================
    // GOOGLE MAPS
    // ================================
    window.openGoogleMaps = function () {

        window.open(
            "https://www.google.com/maps/search/?api=1&query=2.3807618,103.7116231",
            "_blank"
        );

    };


    // ================================
    // WAZE
    // ================================
    window.openWaze = function () {

        window.open(
            "https://www.waze.com/ul?ll=2.3807618%2C103.7116231&navigate=yes",
            "_blank"
        );

    };


    // ================================
    // GOOGLE CALENDAR
    // ================================
    window.addGoogleCalendar = function () {

        const title =
            "Majlis Perkahwinan Sikin & Aziman";

        const start =
            "20261219T030000Z";

        const end =
            "20261219T080000Z";

        const location =
            "No 66 Blok 5B Jalan Merak, Felda Nitar 01, 86800 Mersing, Johor";

        const details =
            "Walimatulurus Sikin & Aziman";

        const url =
            "https://calendar.google.com/calendar/render" +
            "?action=TEMPLATE" +
            "&text=" + encodeURIComponent(title) +
            "&dates=" + start + "/" + end +
            "&location=" + encodeURIComponent(location) +
            "&details=" + encodeURIComponent(details);

        window.open(url, "_blank");
    };


    // ================================
    // APPLE CALENDAR
    // ================================
    window.addAppleCalendar = function () {

        const ics = `BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//Sikin & Aziman//Wedding//MS
BEGIN:VEVENT
DTSTART:20261219T030000Z
DTEND:20261219T080000Z
SUMMARY:Majlis Perkahwinan Sikin & Aziman
LOCATION:No 66 Blok 5B Jalan Merak, Felda Nitar 01, 86800 Mersing, Johor
DESCRIPTION:Walimatulurus Sikin & Aziman
END:VEVENT
END:VCALENDAR`;

        const blob =
            new Blob([ics], {
                type: "text/calendar;charset=utf-8"
            });

        const url =
            URL.createObjectURL(blob);

        const a =
            document.createElement("a");

        a.href = url;

        a.download =
            "jemputan-sikin-aziman.ics";

        document.body.appendChild(a);

        a.click();

        document.body.removeChild(a);

        URL.revokeObjectURL(url);
    };


    // ================================
    // POPUP MENU
    // ================================
    const menus = {
        calBtn: "calPopup",
        locBtn: "locPopup",
        musBtn: "musPopup",
        rsvpBtn: "rsvpPopup"
    };

    Object.entries(menus).forEach(
        ([buttonId, popupId]) => {

            const button =
                document.getElementById(buttonId);

            const popup =
                document.getElementById(popupId);

            if (!button || !popup) return;

            button.addEventListener(
                "click",
                (e) => {

                    e.stopPropagation();

                    closeAllPopups();

                    popup.classList.add("open");

                }
            );

        }
    );


    // ================================
    // HOME BUTTON
    // ================================
    const homeBtn =
        document.getElementById("homeBtn");

    if (homeBtn) {

        homeBtn.addEventListener(
            "click",
            () => {

                closeAllPopups();

                document.getElementById("home")
                    .scrollIntoView({
                        behavior: "smooth"
                    });

            }
        );

    }


    // ================================
    // CLOSE POPUP
    // ================================
    document
        .querySelectorAll(".close-popup")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    const popupId =
                        button.dataset.close;

                    const popup =
                        document.getElementById(popupId);

                    if (popup) {
                        popup.classList.remove("open");
                    }

                }
            );

        });


    function closeAllPopups() {

        document
            .querySelectorAll(".popup-menu")
            .forEach(popup => {

                popup.classList.remove("open");

            });

    }


    // Klik luar popup
    document.addEventListener(
        "click",
        (e) => {

            if (
                !e.target.closest(".popup-menu") &&
                !e.target.closest(".bottom-nav")
            ) {

                closeAllPopups();

            }

        }
    );


    // ================================
    // RSVP
    // ================================
    document
        .querySelectorAll(".rsvp-option")
        .forEach(option => {

            option.addEventListener(
                "click",
                () => {

                    const value =
                        option.dataset.val;

                    const successPopup =
                        document.getElementById(
                            "successPopup"
                        );

                    const title =
                        document.getElementById(
                            "successTitle"
                        );

                    const msg =
                        document.getElementById(
                            "successMsg"
                        );

                    if (value === "hadir") {

                        title.textContent =
                            "Terima Kasih! 💙";

                        msg.textContent =
                            "Kami sangat mengalu-alukan kehadiran anda ke majlis Sikin & Aziman.";

                    } else {

                        title.textContent =
                            "Terima Kasih! 🙏";

                        msg.textContent =
                            "Terima kasih kerana memaklumkan kepada kami.";

                    }

                    closeAllPopups();

                    successPopup.classList.add("open");

                }
            );

        });


    // ================================
    // MUZIK
    // ================================
    const music =
        document.getElementById("weddingMusic");

    const musicButton =
        document.getElementById("musPlayBtn");

    const floatingButton =
        document.getElementById("musicFloating");

    let musicPlaying = false;

    function toggleMusic() {

        if (!music) return;

        if (musicPlaying) {

            music.pause();

            musicPlaying = false;

            if (musicButton) {
                musicButton.textContent =
                    "▶ Mainkan Muzik";
            }

            if (floatingButton) {
                floatingButton.textContent =
                    "🎵";
            }

        } else {

            music.play()
                .then(() => {

                    musicPlaying = true;

                    if (musicButton) {
                        musicButton.textContent =
                            "⏸ Hentikan Muzik";
                    }

                    if (floatingButton) {
                        floatingButton.textContent =
                            "⏸";
                    }

                })
                .catch(() => {

                    alert(
                        "Sila masukkan fail lagu MP3 pada bahagian audio."
                    );

                });

        }

    }

    if (musicButton) {
        musicButton.addEventListener(
            "click",
            toggleMusic
        );
    }

    if (floatingButton) {
        floatingButton.addEventListener(
            "click",
            toggleMusic
        );
    }

});
</script>
